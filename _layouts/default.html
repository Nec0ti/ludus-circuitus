<!doctype html>
<html lang="tr" data-theme="ludus">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1b232b">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% seo %}
  </head>
  <body>
    <a class="btn btn-sm skip-link" href="#ana-icerik">İçeriğe geç</a>
    {% include nav.html %}
    <main id="ana-icerik">{{ content }}</main>
    {% include footer.html %}
  </body>
</html>
